{% extends "base.html" %}

{% block title %}{{ title or 'Authentication Status' }} - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-7 col-lg-6 col-xl-5">
        <div class="card card-custom p-4 p-md-5 text-center shadow-sm">
            <div class="mb-3">
                {% if badge_class == 'danger' %}
                <div class="bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-shield-x fs-1"></i>
                </div>
                {% elif badge_class == 'warning' %}
                <div class="bg-warning bg-opacity-10 text-warning d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                </div>
                {% else %}
                <div class="bg-info bg-opacity-10 text-info d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-info-circle fs-1"></i>
                </div>
                {% endif %}
            </div>

            <h3 class="fw-bold mb-2">{{ title }}</h3>
            <p class="text-secondary mb-4">{{ message }}</p>

            <div class="d-grid gap-2">
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary py-2 fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
