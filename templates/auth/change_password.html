{% extends "base.html" %}

{% block title %}Change Password - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 shadow-sm">
            <div class="d-flex align-items-center mb-3 pb-2 border-bottom">
                <i class="bi bi-shield-lock-fill text-warning fs-3 me-2"></i>
                <h4 class="fw-bold mb-0">Change Account Password</h4>
            </div>

            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="current_password" class="form-label fw-semibold">Current Password *</label>
                    <input type="password" class="form-control" id="current_password" name="current_password" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label fw-semibold">New Password *</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required>
                    <div class="form-text">Must be at least 6 characters in length.</div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm New Password *</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
