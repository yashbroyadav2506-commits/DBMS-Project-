{% extends "base.html" %}

{% block title %}{{ action }} Product - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card card-custom p-4 bg-white shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h3 class="fw-bold mb-0">
                    <i class="bi {% if action == 'Add' %}bi-plus-circle text-success{% else %}bi-pencil-square text-primary{% endif %} me-2"></i>
                    {{ action }} Product
                </h3>
                <span class="badge bg-danger">Manager Authorized</span>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="product_name" class="form-label fw-bold">Product Name *</label>
                        <input type="text" class="form-control" id="product_name" name="product_name" value="{{ product.product_name if product else '' }}" required placeholder="e.g. Amul Gold Milk 1L">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="category" class="form-label fw-bold">Category</label>
                        <input type="text" class="form-control" id="category" name="category" list="categoryList" value="{{ product.category if product else '' }}" placeholder="e.g. Dairy, Snacks, Staples">
                        <datalist id="categoryList">
                            {% for c in categories %}
                            <option value="{{ c }}">
                            {% endfor %}
                        </datalist>
                    </div>

                    <div class="col-md-4">
                        <label for="price" class="form-label fw-bold">Price (₹) *</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="price" name="price" value="{{ product.price if product else '' }}" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="stock_qty" class="form-label fw-bold">Stock Quantity *</label>
                        <input type="number" min="0" class="form-control" id="stock_qty" name="stock_qty" value="{{ product.stock_qty if product else '0' }}" required>
                    </div>

                    <div class="col-md-4">
                        <label for="reorder_level" class="form-label fw-bold">Reorder Level *</label>
                        <input type="number" min="0" class="form-control" id="reorder_level" name="reorder_level" value="{{ product.reorder_level if product else '10' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="brand_id" class="form-label fw-bold">Brand</label>
                        <select class="form-select" id="brand_id" name="brand_id">
                            <option value="">-- No Brand / Select Brand --</option>
                            {% for b in brands %}
                            <option value="{{ b.brand_id }}" {% if product and product.brand_id == b.brand_id %}selected{% endif %}>{{ b.brand_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="supplier_id" class="form-label fw-bold">Supplier</label>
                        <select class="form-select" id="supplier_id" name="supplier_id">
                            <option value="">-- No Supplier / Select Supplier --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.supplier_id }}" {% if product and product.supplier_id == s.supplier_id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                    <a href="{{ url_for('products.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
