{% extends "base.html" %}

{% block title %}500 Server Error - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 text-center">
    <div class="col-md-6">
        <div class="card card-custom p-5 bg-white border-danger shadow">
            <i class="bi bi-exclamation-octagon text-danger display-1 mb-3"></i>
            <h1 class="fw-bold text-danger">500 - Internal Server Error</h1>
            <p class="text-muted">An unexpected server or database error occurred.</p>
            <div class="mt-4">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-dark">
                    <i class="bi bi-house me-1"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
