{% extends "base.html" %}

{% block title %}{{ action }} Brand - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-custom p-4 bg-white shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-tag text-primary me-2"></i>{{ action }} Brand
                </h4>
                <span class="badge bg-danger">Manager</span>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-4">
                    <label for="brand_name" class="form-label fw-bold">Brand Name *</label>
                    <input type="text" class="form-control" id="brand_name" name="brand_name" value="{{ brand.brand_name if brand else '' }}" required placeholder="e.g. Nestle, Britannia, Tata">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('suppliers_brands.brands_list') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Save Brand
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
