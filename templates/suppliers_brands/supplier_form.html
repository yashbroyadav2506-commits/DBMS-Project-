{% extends "base.html" %}

{% block title %}{{ action }} Supplier - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 bg-white shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-truck text-warning me-2"></i>{{ action }} Supplier
                </h4>
                <span class="badge bg-danger">Manager</span>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Supplier / Company Name *</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name if supplier else '' }}" required placeholder="e.g. Amul India Dairy Ltd">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-bold">Phone Number</label>
                    <input type="text" class="form-control" id="phone" name="phone" value="{{ supplier.phone if supplier else '' }}" placeholder="e.g. 9822334455">
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ supplier.email if supplier else '' }}" placeholder="e.g. supply@amul.com">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('suppliers_brands.suppliers_list') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Save Supplier
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
