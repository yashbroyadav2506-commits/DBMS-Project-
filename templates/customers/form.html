{% extends "base.html" %}

{% block title %}{{ action }} Customer - Grocery Store DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 bg-white shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-person-gear text-primary me-2"></i>{{ action }} Customer
                </h4>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Full Name *</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ customer.name if customer else '' }}" required placeholder="e.g. Ramesh Kumar">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-bold">Phone Number</label>
                    <input type="text" class="form-control" id="phone" name="phone" value="{{ customer.phone if customer else '' }}" placeholder="e.g. 9876543210">
                </div>

                <div class="mb-4">
                    <label for="city" class="form-label fw-bold">City</label>
                    <input type="text" class="form-control" id="city" name="city" value="{{ customer.city if customer else '' }}" placeholder="e.g. Nagpur">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('customers.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Save Customer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
